<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraAI — Цветочный Консьерж</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d48c96;
            --primary-dark: #b86b77;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #f7e6e9 50%, #e8f0ed 100%);
            --glass: rgba(255, 255, 255, 0.75);
            --text: #2c2526;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Падающие лепестки на фоне */
        .petal {
            position: absolute;
            background: rgba(212, 140, 150, 0.25);
            border-radius: 150% 0 150% 0;
            animation: float 12s infinite linear;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Контейнер чата */
        .chat-wrapper {
            width: 400px;
            max-width: 95vw;
            height: 680px;
            max-height: 92vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 25px 50px -12px rgba(184, 107, 119, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 1;
            overflow: hidden;
        }

        /* Шапка */
        .chat-header {
            padding: 20px 24px;
            background: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=150&q=80') center/cover;
            position: relative;
            box-shadow: 0 4px 10px rgba(212, 140, 150, 0.4);
        }
        .avatar::after {
            content: '';
            position: absolute;
            bottom: 2px; right: 2px;
            width: 10px; height: 10px;
            background: #4caf50;
            border: 2px solid #fff;
            border-radius: 50%;
        }
        .header-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text);
        }
        .header-info p {
            font-size: 0.75rem;
            color: #7a6e70;
        }

        /* Область сообщений */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
        }
        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.bot {
            background: #fff;
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .msg.user {
            background: var(--primary);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(212, 140, 150, 0.3);
        }

        /* Карусель букетов */
        .carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-snap-type: x mandatory;
            animation: popIn 0.5s ease forwards;
        }
        .carousel::-webkit-scrollbar { height: 4px; }
        .carousel::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .card {
            min-width: 210px;
            background: #fff;
            border-radius: 20px;
            padding: 10px;
            scroll-snap-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(212, 140, 150, 0.25);
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 14px;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            margin: 10px 4px 4px;
            color: var(--text);
        }
        .card-price {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin: 0 4px 10px;
        }
        .card-btn {
            margin-top: auto;
            background: #fdf6f7;
            color: var(--primary-dark);
            border: 1px solid var(--primary);
            padding: 8px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* Быстрые ответы (Чипсы) */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .chip {
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(212, 140, 150, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: scale(1.03);
        }

        /* Индикатор набора текста */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 20px;
            align-self: flex-start;
            width: fit-content;
        }
        .dot {
            width: 6px; height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Подвал ввода */
        .chat-footer {
            padding: 14px 20px;
            background: rgba(255,255,255,0.6);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-footer input {
            flex: 1;
            border: none;
            background: #fff;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .chat-footer button {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(212, 140, 150, 0.3);
            transition: all 0.2s;
        }
        .chat-footer button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-wrapper">
        <div class="chat-header">
            <div class="avatar"></div>
            <div class="header-info">
                <h1>FloraAI</h1>
                <p>Ваш личный цветочный консьерж</p>
            </div>
        </div>
        
        <div class="chat-body" id="chatBody">
            <div class="msg bot">Приветствую! Я FloraAI. Помогу выбрать идеальный букет, составить поздравление или оформить доставку цветов. Что вас интересует?</div>
            
            <div class="chips">
                <div class="chip" onclick="selectOption('Выбрать букет')">💐 Выбрать букет</div>
                <div class="chip" onclick="selectOption('Повод для подарка')">🎉 Повод для подарка</div>
                <div class="chip" onclick="selectOption('Статус заказа')">📦 Статус заказа</div>
            </div>
        </div>

        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Элементы лепестков для анимации -->
    <script>
        function createPetals() {
            const count = 15;
            for (let i = 0; i < count; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 15 + 10 + 'px';
                petal.style.height = petal.style.width;
                petal.style.animationDelay = Math.random() * 10 + 's';
                petal.style.animationDuration = Math.random() * 8 + 8 + 's';
                document.body.appendChild(petal);
            }
        }
        createPetals();

        const chatBody = document.getElementById('chatBody');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function selectOption(text) {
            userInput.value = text;
            sendMessage();
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Сообщение пользователя
            appendMessage(text, 'user');
            userInput.value = '';

            // Показываем индикатор набора
            const typingIndicator = showTyping();
            
            setTimeout(() => {
                typingIndicator.remove();
                
                if (text.toLowerCase().includes('букет')) {
                    appendMessage('Конечно! Вот наши самые популярные весенние композиции:', 'bot');
                    appendCarousel();
                } else {
                    appendMessage('Прекрасный выбор. Сейчас я подберу лучшие варианты под ваш запрос. Пожалуйста, подождите секунду.', 'bot');
                }
            }, 1200);
        }

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.classList.add('msg', sender);
            msg.innerText = text;
            chatBody.appendChild(msg);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.classList.add('typing');
            typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBody.appendChild(typing);
            chatBody.scrollTop = chatBody.scrollHeight;
            return typing;
        }

        function appendCarousel() {
            const carousel = document.createElement('div');
            carousel.classList.add('carousel');
            carousel.innerHTML = `
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=300&q=80" alt="Нежность">
                    <div class="card-title">Нежность Пионов</div>
                    <div class="card-price">4 500 ₽</div>
                    <button class="card-btn" onclick="appendMessage('Вы выбрали букет \'Нежность Пионов\'. Оформляю заказ...', 'bot')">Заказать</button>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1596436889106-be35e843f974?auto=format&fit=crop&w=300&q=80" alt="Солнце">
                    <div class="card-title">Лучи Солнца</div>
                    <div class="card-price">3 200 ₽</div>
                    <button class="card-btn" onclick="appendMessage('Вы выбрали букет \'Лучи Солнца\'. Оформляю заказ...', 'bot')">Заказать</button>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=300&q=80" alt="Классика">
                    <div class="card-title">Алая Классика</div>
                    <div class="card-price">5 100 ₽</div>
                    <button class="card-btn" onclick="appendMessage('Вы выбрали букет \'Алая Классика\'. Оформляю заказ...', 'bot')">Заказать</button>
                </div>
            `;
            chatBody.appendChild(carousel);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
