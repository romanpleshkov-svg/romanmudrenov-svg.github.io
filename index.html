<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flower Bot 1.0 — Цветочная мастерская</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f5365c;
            --primary-dark: #d92548;
            --gradient: linear-gradient(87deg, #f5365c 0, #f56036 100%);
            --bg: #f8f9fe;
            --surface: #ffffff;
            --text-main: #2b2b43;
            --text-muted: #83889c;
            --success: #2dce89;
            --border: #edf0f7;
            --shadow: 0 12px 32px rgba(43, 43, 67, 0.06);
            --btn-shadow: 0 4px 12px rgba(245, 54, 92, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-navbar {
            height: 68px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 30;
            flex-shrink: 0;
        }

        .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .brand-logo {
            width: 42px; height: 42px; border-radius: 13px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.35rem; box-shadow: var(--btn-shadow);
        }
        .brand-text h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; line-height: 1.1; color: var(--text-main); }
        .brand-text span { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .online-dot-sm { width: 7px; height: 7px; background: var(--success); border-radius: 50%; display: inline-block; }

        .nav-tabs { display: flex; gap: 8px; }
        .nav-tab {
            padding: 9px 16px; border-radius: 12px; border: 1px solid transparent;
            background: transparent; font-weight: 600; font-size: 0.88rem;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s;
        }
        .nav-tab.active, .nav-tab:hover {
            color: var(--primary); background: #fff0f3; border-color: rgba(245, 54, 92, 0.15);
        }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .action-btn {
            background: var(--surface); border: 1px solid var(--border);
            padding: 9px 15px; border-radius: 12px; font-size: 0.84rem; font-weight: 700;
            color: var(--text-main); display: flex; align-items: center; gap: 8px;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.03); transition: all 0.2s;
        }
        .action-btn:hover { border-color: var(--primary); }
        .badge { background: var(--gradient); color: #fff; padding: 2px 7px; border-radius: 8px; font-size: 0.72rem; }

        /* ГЛАВНЫЙ РАБОЧИЙ ЭКРАН */
        .main-workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 400px;
            overflow: hidden;
            width: 100%;
            min-height: 0;
        }

        /* ЛЕВАЯ ЧАСТЬ: ВИТРИНА И ПОРТФОЛИО */
        .showcase-panel {
            height: 100%;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .hero-banner {
            background: linear-gradient(120deg, #2b2b43 0%, #4a2545 100%);
            border-radius: 22px;
            padding: 24px 28px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        .hero-banner h2 { font-family: 'Playfair Display', serif; font-size: 1.65rem; margin-bottom: 6px; }
        .hero-banner p { font-size: 0.88rem; opacity: 0.9; max-width: 540px; line-height: 1.45; margin-bottom: 14px; }
        .hero-btn {
            background: var(--gradient); color: #fff; border: none; padding: 10px 18px;
            border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: var(--btn-shadow);
        }

        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
        .filter-pill {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
            background: #fff; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--text-main); transition: 0.2s;
        }
        .filter-pill.active { background: var(--gradient); color: #fff; border-color: transparent; box-shadow: var(--btn-shadow); }

        /* СЕТКА КАРТОЧЕК БУКЕТА */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 18px;
            padding-bottom: 40px;
        }

        .product-card {
            background: #fff; border-radius: 18px; padding: 12px;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            display: flex; flex-direction: column; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; position: relative;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(43, 43, 67, 0.11); }
        .product-card img {
            width: 100%; height: 210px; object-fit: cover; border-radius: 13px; background: #f3f4f8; display: block;
        }
        .zoom-badge {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.55);
            color: #fff; font-size: 0.68rem; padding: 4px 9px; border-radius: 20px; backdrop-filter: blur(4px);
        }
        .p-tag { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-top: 10px; }
        .p-title { font-weight: 700; font-size: 1rem; margin: 3px 0; color: var(--text-main); }
        .p-desc { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.35; }
        .p-footer {
            margin-top: auto; display: flex; align-items: center; justify-content: space-between;
            padding-top: 10px; border-top: 1px solid var(--border); gap: 6px;
        }
        .p-price { font-weight: 700; font-size: 1rem; color: var(--text-main); white-space: nowrap; }
        .btn-buy {
            background: var(--gradient); color: #fff; border: none; padding: 8px 13px;
            border-radius: 10px; font-size: 0.78rem; font-weight: 600; cursor: pointer; box-shadow: var(--btn-shadow); white-space: nowrap;
        }

        /* ПРАВАЯ ЧАСТЬ: ЧИСТЫЙ ДИАЛОГ С БОТОМ */
        .chat-panel {
            height: 100%;
            background: #ffffff;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .chat-panel-header {
            padding: 14px 18px;
            background: #fcfcfd;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .ai-status { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 700; }
        .pulse-dot { width: 9px; height: 9px; background: var(--success); border-radius: 50%; box-shadow: 0 0 0 4px rgba(45, 206, 137, 0.18); }

        .chat-area {
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
            background: linear-gradient(180deg, #ffffff 0%, #fff8fa 100%);
            min-height: 0;
        }

        .msg {
            max-width: 88%; padding: 12px 15px; border-radius: 18px;
            font-size: 0.88rem; line-height: 1.48; animation: popUp 0.2s ease forwards;
            word-wrap: break-word; display: flex; flex-direction: column; gap: 8px;
        }
        @keyframes popUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .msg.bot {
            background: #ffffff; color: var(--text-main); align-self: flex-start;
            border-bottom-left-radius: 4px; box-shadow: 0 4px 14px rgba(43, 43, 67, 0.05);
            border: 1px solid var(--border);
        }
        .msg.user {
            background: var(--gradient); color: #fff; align-self: flex-end;
            border-bottom-right-radius: 4px; box-shadow: var(--btn-shadow);
        }

        .chat-action-link {
            display: inline-block; margin-top: 4px; padding: 8px 13px;
            background: #fff0f3; color: var(--primary); border: 1px solid rgba(245, 54, 92, 0.25);
            border-radius: 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center;
        }

        .widget-card { background: var(--surface); border-radius: 14px; padding: 8px; border: 1px solid var(--border); width: 100%; }
        .map-frame { width: 100%; height: 140px; border-radius: 10px; overflow: hidden; margin-bottom: 8px; background: #e9ecef; }

        .quick-bar {
            padding: 8px 12px; background: #fff; border-top: 1px solid var(--border);
            display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; flex-shrink: 0;
        }
        .quick-bar::-webkit-scrollbar { display: none; }
        .chip {
            background: #f8f9fe; border: 1px solid var(--border); padding: 7px 12px; border-radius: 18px;
            font-size: 0.76rem; font-weight: 600; color: var(--text-main); cursor: pointer; flex-shrink: 0;
        }
        .chip:hover, .chip:active { background: var(--gradient); color: #fff; border-color: transparent; }

        .footer-input {
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            background: #fff; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0;
        }
        .footer-input input {
